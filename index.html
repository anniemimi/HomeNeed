<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>家務補給單</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=JetBrains+Mono:wght@400;500&family=Noto+Sans+TC:wght@400;500&display=swap">
<style id="css">
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0}
:root{
  --pp-page:#ECEAE5; --pp-card:#FFFFFF; --pp-card-sub:#F3F1EC;
  --pp-ink:#232220; --pp-ink-sub:#6E6B64; --pp-ink-hint:#9A968D;
  --pp-line:#D8D5CE; --pp-line-strong:#C3BFB6;
  --pp-accent:#9C3D2C; --pp-accent-dark:#843022; --pp-accent-soft:#F2E3DE;
  --pp-attn:#B07D24; --pp-attn-soft:#F5EBD8;
  --pp-done:#5C7355;
  color-scheme:light;
}
body{
  background:var(--pp-page); color:var(--pp-ink);
  font-family:"Noto Sans TC","Inter",-apple-system,BlinkMacSystemFont,"PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  font-size:15px; line-height:1.7; font-weight:400; -webkit-text-size-adjust:100%;
}
img{max-width:100%}
[hidden]{display:none!important}
.mono{font-family:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px;font-variant-numeric:tabular-nums}

.wrap{max-width:600px;margin:0 auto;padding-inline:20px;padding-block:0 128px}

header.top{
  position:sticky; top:env(safe-area-inset-top,0px); z-index:20;
  background:var(--pp-page); border-bottom:.5px solid var(--pp-line);
  margin-inline:-20px; padding:18px 20px 0;
}
.brand{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.brand h1{font-size:20px;font-weight:500;letter-spacing:.02em;margin:0;line-height:1.3}
.brand .sub{font-size:11px;color:var(--pp-ink-hint);letter-spacing:.2em;text-transform:uppercase;font-family:"Inter",sans-serif}
nav.tabs{display:flex;margin-top:14px}
nav.tabs button{
  appearance:none;background:none;border:0;border-bottom:1px solid transparent;
  padding:8px 0 10px;margin-right:24px;font:inherit;font-size:14px;font-weight:400;
  color:var(--pp-ink-hint);cursor:pointer;
}
nav.tabs button[aria-current="true"]{color:var(--pp-ink);font-weight:500;border-bottom-color:var(--pp-ink)}
nav.tabs button:focus-visible{outline:1px solid var(--pp-ink);outline-offset:3px}

.lead{color:var(--pp-ink-sub);font-size:15px;margin:24px 0 0}
.lead .idn{display:block;color:var(--pp-ink-hint);font-size:13px;font-family:"Inter",sans-serif;margin-top:2px}

h2.cat{
  font-size:13px;font-weight:500;letter-spacing:.14em;color:var(--pp-ink-sub);
  margin:32px 0 12px;display:flex;align-items:center;gap:12px;
}
h2.cat::after{content:"";flex:1;height:0;border-top:.5px solid var(--pp-line)}
h2.cat em{font-style:normal;font-weight:400;letter-spacing:0;color:var(--pp-ink-hint);font-family:"Inter",sans-serif;font-size:12px}
.bi{display:block;font-size:11px;font-weight:400;letter-spacing:0;color:var(--pp-ink-hint);font-family:"Inter",sans-serif;line-height:1.35;margin-top:1px}
.btn .bi{color:inherit;opacity:.72}
nav.tabs button .bi{font-size:10px}
.urg button .bi{font-size:10px}
.steps{counter-reset:s;margin:0;padding:0;list-style:none}
.steps li{counter-increment:s;position:relative;padding-left:28px;margin-bottom:14px;font-size:15px;line-height:1.6}
.steps li::before{content:counter(s);position:absolute;left:0;top:1px;width:20px;height:20px;border-radius:50%;
  background:var(--pp-ink);color:var(--pp-page);font-size:12px;font-family:"JetBrains Mono",monospace;
  display:grid;place-items:center;line-height:1}
.steps li span{display:block;font-size:13px;color:var(--pp-ink-sub);font-family:"Inter",sans-serif;line-height:1.5;margin-top:2px}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(158px,1fr));gap:8px}
.chip{
  appearance:none;text-align:left;font:inherit;cursor:pointer;
  background:var(--pp-card);border:.5px solid var(--pp-line-strong);border-radius:8px;
  padding:12px 13px;color:var(--pp-ink);display:block;width:100%;line-height:1.45;
}
.chip:focus-visible{outline:1px solid var(--pp-ink);outline-offset:2px}
.chip .zh{font-size:15px;font-weight:400;display:block}
.chip .idn{font-size:12px;color:var(--pp-ink-hint);display:block;margin-top:3px;font-family:"Inter",sans-serif}
.chip[aria-pressed="true"]{background:var(--pp-card-sub);border-color:var(--pp-ink);border-width:1px;padding:11.5px 12.5px}
.chip[aria-pressed="true"] .zh{font-weight:500}
.chip[aria-pressed="true"] .zh::before{content:"✓\00a0"}

.card{background:var(--pp-card);border:.5px solid var(--pp-line);border-radius:12px;padding:20px}
.card + .card{margin-top:12px}

.selrow{display:flex;align-items:center;gap:12px;padding:14px 0;border-bottom:.5px solid var(--pp-line)}
.selrow .nm{flex:1;min-width:0}
.selrow .nm b{font-weight:400;font-size:15px;display:block;overflow-wrap:anywhere}
.selrow .nm span{font-size:12px;color:var(--pp-ink-hint);display:block;font-family:"Inter",sans-serif}
.x{appearance:none;background:none;border:0;color:var(--pp-ink-hint);font-size:19px;line-height:1;cursor:pointer;padding:6px;flex:none;font-family:inherit}
.urg{display:flex;gap:8px;padding-bottom:16px;border-bottom:.5px solid var(--pp-line);flex-wrap:wrap}
.selrow{border-bottom:0;padding-bottom:4px}
.urglbl{margin:0 0 7px;font-size:12px;color:var(--pp-ink-sub)}
.urglbl em{font-style:normal;color:var(--pp-ink-hint);font-family:"Inter",sans-serif;margin-left:4px}
.urg button{
  appearance:none;font:inherit;font-size:13px;cursor:pointer;
  background:var(--pp-card-sub);border:.5px solid transparent;border-radius:8px;
  padding:5px 12px;color:var(--pp-ink-sub);
}
.urg button[aria-pressed="true"]{background:var(--pp-card);border-color:var(--pp-ink);color:var(--pp-ink);font-weight:500}
.urg button[data-u="1"][aria-pressed="true"],
.urg button[data-u="2"][aria-pressed="true"]{background:var(--pp-attn-soft);border-color:var(--pp-attn);color:var(--pp-attn)}
.card > .urg:last-child{border-bottom:0;padding-bottom:0}

.field{display:flex;gap:8px;margin-top:12px}
input[type=text],input[type=url],select,textarea{
  font:inherit;font-size:15px;color:var(--pp-ink);background:var(--pp-card);
  border:.5px solid var(--pp-line-strong);border-radius:8px;padding:10px 12px;width:100%;
}
textarea{line-height:1.6;resize:vertical}
input::placeholder,textarea::placeholder{color:var(--pp-ink-hint)}
input:focus,select:focus,textarea:focus{outline:1px solid var(--pp-ink);outline-offset:-1px}
label.lbl{font-size:12px;color:var(--pp-ink-sub);display:block;margin-bottom:4px}

.btn{
  appearance:none;font:inherit;font-size:15px;font-weight:500;cursor:pointer;
  background:var(--pp-ink);color:var(--pp-page);border:.5px solid var(--pp-ink);
  border-radius:8px;padding:11px 18px;white-space:nowrap;
}
.btn.cta{background:var(--pp-accent);border-color:var(--pp-accent);color:#fff}
.btn.cta:active{background:var(--pp-accent-dark);border-color:var(--pp-accent-dark)}
.btn.ghost{background:var(--pp-card);color:var(--pp-ink);border-color:var(--pp-line-strong);font-weight:400}
.btn:focus-visible{outline:1px solid var(--pp-ink);outline-offset:3px}
.btn.wide{width:100%;display:block;text-align:center;text-decoration:none}

.dock{
  position:fixed;left:0;right:0;bottom:0;z-index:30;
  background:var(--pp-page);border-top:.5px solid var(--pp-line-strong);
  padding:14px 20px calc(14px + env(safe-area-inset-bottom,0px));
}
.dock .in{max-width:600px;margin:0 auto;display:flex;align-items:center;gap:14px}
.dock .count{flex:1;font-size:13px;color:var(--pp-ink-sub);line-height:1.5}
.dock .count b{color:var(--pp-ink);font-weight:500}

.chan{margin-top:28px}
.chan h3{font-size:16px;font-weight:500;margin:0 0 10px;display:flex;align-items:baseline;gap:10px}
.chan h3 .n{font-family:"JetBrains Mono",monospace;font-size:13px;font-weight:400;color:var(--pp-ink-hint)}
.buyrow{display:flex;align-items:flex-start;gap:12px;padding:14px 0;border-bottom:.5px solid var(--pp-line)}
.buyrow:last-child{border-bottom:0}
.tick{
  appearance:none;flex:none;width:22px;height:22px;margin-top:3px;cursor:pointer;
  border:.5px solid var(--pp-line-strong);border-radius:6px;background:var(--pp-card);
  display:grid;place-items:center;font-size:13px;color:transparent;line-height:1;font-family:inherit;
}
.tick[aria-pressed="true"]{background:var(--pp-done);border-color:var(--pp-done);color:#fff}
.buyrow .body{flex:1;min-width:0}
.buyrow .body b{font-weight:400;font-size:15px;overflow-wrap:anywhere}
.buyrow .meta{font-size:12px;color:var(--pp-ink-hint);margin-top:1px}
.buyrow.done .body{color:var(--pp-ink-hint);text-decoration:line-through}
.tag{display:inline-block;font-size:12px;border-radius:6px;padding:1px 8px;margin-left:8px;
  background:var(--pp-attn-soft);color:var(--pp-attn);vertical-align:1px}
.go{
  flex:none;font-size:14px;text-decoration:none;color:#fff;background:var(--pp-accent);
  border:.5px solid var(--pp-accent);border-radius:8px;padding:6px 14px;margin-top:1px;white-space:nowrap;font-weight:500;
}
.nolink{flex:none;font-size:12px;color:var(--pp-ink-hint);margin-top:6px;white-space:nowrap}

.empty{color:var(--pp-ink-sub);font-size:15px;padding:48px 4px;line-height:2}
.note{font-size:13px;color:var(--pp-ink-sub);line-height:1.8;margin-top:14px}
.foot{margin-top:48px;padding-top:16px;border-top:.5px solid var(--pp-line);font-size:12px;color:var(--pp-ink-hint);display:flex;justify-content:space-between;gap:12px}
.foot button{appearance:none;background:none;border:0;font:inherit;font-size:12px;color:var(--pp-ink-hint);cursor:pointer;text-decoration:underline}

.mrow{border-bottom:.5px solid var(--pp-line);padding:16px 0}
.mrow:last-of-type{border-bottom:0}
.mhead{display:flex;align-items:center;gap:10px}
.mhead .n{flex:1;font-weight:500}
.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
@media (max-width:440px){.mgrid{grid-template-columns:1fr}}

.toast{
  position:fixed;left:50%;transform:translateX(-50%);bottom:calc(96px + env(safe-area-inset-bottom,0px));
  background:var(--pp-ink);color:var(--pp-page);font-size:13px;padding:9px 18px;border-radius:8px;z-index:60;
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

<script id="app">
(function(){
"use strict";
var $=function(s,r){return (r||document).querySelector(s)};
var esc=function(t){return String(t==null?"":t).replace(/[&<>"']/g,function(c){
  return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})};
var LS={
  get:function(k,d){try{var v=localStorage.getItem("jwbj."+k);return v?JSON.parse(v):d}catch(e){return d}},
  set:function(k,v){try{localStorage.setItem("jwbj."+k,JSON.stringify(v))}catch(e){}}
};

var D=JSON.parse(document.getElementById("data").textContent);
var ITEMS=LS.get("items",null)||D.items;
var CATS=LS.get("cats",null)||D.cats;
var CATSIDN=LS.get("catsIdn",null)||D.catsIdn||{};
function catLabel(c){var i=CATSIDN[c];return esc(c)+(i?' <em>'+esc(i)+'</em>':"")}
var CHANS=LS.get("chans",null)||D.chans;
var LIST=LS.get("list",[]);
var ADMIN=LS.get("admin",false);

var mode="order", sel={}, freeRows=[], inbox=null, toastT=null;
var URG=[{zh:"還夠，快沒了",idn:"Masih ada, hampir habis"},{zh:"這兩天要",idn:"Perlu 2 hari ini"},{zh:"今天就要",idn:"Perlu hari ini"}];

function uid(p){return p+Math.random().toString(36).slice(2,8)}
function byId(id){for(var i=0;i<ITEMS.length;i++)if(ITEMS[i].id===id)return ITEMS[i];return null}
function b64e(s){return btoa(unescape(encodeURIComponent(s))).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"")}
function b64d(s){s=s.replace(/-/g,"+").replace(/_/g,"/");while(s.length%4)s+="=";return decodeURIComponent(escape(atob(s)))}
function toast(m){var e=$("#toast");if(!e){e=document.createElement("div");e.id="toast";e.className="toast";document.body.appendChild(e)}
  e.textContent=m;e.hidden=false;clearTimeout(toastT);toastT=setTimeout(function(){e.hidden=true},2200)}
function fmt(ts){var d=new Date(ts);return (d.getMonth()+1)+"/"+d.getDate()+" "+String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0")}
function saveAll(){LS.set("items",ITEMS);LS.set("cats",CATS);LS.set("chans",CHANS);LS.set("catsIdn",CATSIDN)}
function saveList(){LS.set("list",LIST)}

/* ---------- 版面 ---------- */
function header(){
  var tabs=[["order","採買單","Daftar belanja"]];
  if(ADMIN)tabs.push(["buy","待採購",""],["manage","品項管理",""]);
  var n=LIST.filter(function(r){return !r.done}).length;
  return '<header class="top"><div class="brand"><h1>家務補給單</h1>'
    +'<span class="sub">Daftar Belanja</span></div><nav class="tabs">'
    +tabs.map(function(t){
      var b=(t[0]==="buy"&&n)?' <span class="mono">'+n+'</span>':"";
      return '<button data-tab="'+t[0]+'" aria-current="'+(mode===t[0])+'">'+t[1]+b
        +(t[2]?'<span class="bi">'+t[2]+'</span>':"")+'</button>'}).join("")
    +'</nav></header>';
}
function footer(){
  return '<div class="foot"><span>初樸家務</span>'
    +(ADMIN?'<button id="exitAdmin">結束管理模式</button>':'<button id="enterAdmin">太太專用</button>')+'</div>';
}

/* ---------- 採買單 ---------- */
function viewOrder(){
  var h='<p class="lead">需要補的東西，點一下就好。<span class="idn">Sentuh barang yang perlu dibeli.</span></p>';
  CATS.forEach(function(c){
    var its=ITEMS.filter(function(i){return i.cat===c});
    if(!its.length)return;
    h+='<h2 class="cat">'+catLabel(c)+'</h2><div class="grid">';
    its.forEach(function(i){
      h+='<button class="chip" data-pick="'+i.id+'" aria-pressed="'+(!!sel[i.id])+'">'
        +'<span class="zh">'+esc(i.zh)+'</span><span class="idn">'+esc(i.idn)+'</span></button>'});
    h+='</div>';
  });
  h+='<h2 class="cat">清單上沒有的 <em>Tidak ada di daftar</em></h2><div class="card">'
   +'<label class="lbl" for="freeIn">自己打上去 · Tulis sendiri</label>'
   +'<div class="field"><input type="text" id="freeIn" placeholder="例：燈泡 / Contoh: lampu"><button class="btn ghost" id="freeAdd">加入<span class="bi">Tambah</span></button></div>'
   +'<p class="note">講不清楚的東西，用 LINE 拍張照片一起傳給太太。'
   +'<span style="display:block;font-family:\'Inter\',sans-serif;color:var(--pp-ink-hint)">Kalau sulit dijelaskan, kirim juga fotonya lewat LINE.</span></p>';
  if(freeRows.length){h+='<div style="margin-top:14px">';freeRows.forEach(function(r,i){h+=rowSel("f"+i,r.name,"",r,"free")});h+='</div>'}
  h+='</div>';
  var keys=Object.keys(sel);
  if(keys.length){
    h+='<h2 class="cat">已選 <em>Sudah dipilih</em></h2><div class="card">';
    keys.forEach(function(id){var it=byId(id);if(!it){delete sel[id];return}h+=rowSel(id,it.zh,it.idn,sel[id],"item")});
    h+='</div>';
  }
  return h+footer();
}
function rowSel(k,zh,idn,r,kind){
  var h='<div class="selrow"><div class="nm"><b>'+esc(zh)+'</b>'+(idn?'<span>'+esc(idn)+'</span>':"")+'</div>'
   +'<button class="x" data-del="'+k+'" data-kind="'+kind+'" aria-label="移除">×</button></div>'
   +'<p class="urglbl">急迫性 <em>Kapan perlunya?</em></p><div class="urg">';
  for(var u=0;u<3;u++)h+='<button data-u="'+u+'" data-k="'+k+'" data-kind="'+kind+'" aria-pressed="'+(r.urg===u)+'">'
    +URG[u].zh+'<span class="bi">'+URG[u].idn+'</span></button>';
  return h+'</div>';
}
function dockOrder(){
  var n=Object.keys(sel).length+freeRows.length;
  if(!n)return "";
  return '<div class="dock"><div class="in"><div class="count">已選 <b class="mono">'+n+'</b> 樣<br>Terpilih '+n+' barang</div>'
    +'<button class="btn cta" id="mk">完成，送給太太<span class="bi">Selesai, kirim ke Nyonya</span></button></div></div>';
}

/* ---------- 送出 ---------- */
function payload(){
  var l=[],f=[];
  Object.keys(sel).forEach(function(id){l.push([id,sel[id].urg])});
  freeRows.forEach(function(r){f.push([r.name,r.urg])});
  return {t:Date.now(),l:l,f:f};
}
function payloadText(p){
  var lines=[];
  (p.l||[]).forEach(function(a){var it=byId(a[0]);if(it)lines.push("・"+it.zh+(a[1]?"（"+URG[a[1]].zh+"）":""))});
  (p.f||[]).forEach(function(a){lines.push("・"+a[0]+(a[1]?"（"+URG[a[1]].zh+"）":""))});
  return "太太，家裡要補這些：\n"+lines.join("\n");
}
function showSent(){
  var p=payload();
  var link=location.href.split("#")[0]+"#o="+b64e(JSON.stringify(p));
  var msg=payloadText(p)+"\n\n"+link;
  $("#root").innerHTML='<div class="wrap">'+header()
   +'<h2 class="cat">送出 <em>Kirim</em></h2><div class="card">'
   +'<ol class="steps">'
   +'<li>按下面紅色的「全部複製」<span>Tekan tombol merah di bawah: 全部複製 (Salin semua)</span></li>'
   +'<li>打開自己的 LINE，貼上，傳給太太<span>Buka LINE Anda, tempel (paste), kirim ke Nyonya</span></li>'
   +'</ol>'
   +'<button class="btn cta wide" id="copyBtn">全部複製<span class="bi">Salin semua</span></button>'
   +'<textarea id="msgBox" rows="9" readonly style="margin-top:14px">'+esc(msg)+'</textarea>'
   +'<p class="note">整段都要傳過去，不要只傳一部分。有拍照片的話，記得一起傳。'
   +'<span style="display:block;font-family:\'Inter\',sans-serif;color:var(--pp-ink-hint)">Kirim SEMUA tulisan ini, jangan sebagian saja. Kalau ada foto, kirim sekalian.</span></p>'
   +(ADMIN?'<button class="btn ghost wide" id="selfTake" style="margin-top:10px">我自己收下（直接加進待採購）</button>':"")
   +'<button class="btn ghost wide" id="backBtn" style="margin-top:10px">回到清單<span class="bi">Kembali ke daftar</span></button>'
   +'</div>'+footer()+'</div>';
  $("#dock").innerHTML="";
  wireCommon();
  $("#copyBtn").onclick=function(){
    var btn=this,ta=$("#msgBox");
    ta.select();ta.setSelectionRange(0,99999);
    var done=function(){
      btn.innerHTML='已複製 ✓<span class="bi">Sudah tersalin — buka LINE, tempel</span>';
      toast("複製好了，打開 LINE 貼上");
    };
    var fail=function(){
      btn.innerHTML='請長按下面文字選「全選」再「複製」<span class="bi">Tekan lama tulisan di bawah → pilih semua → salin</span>';
      toast("請長按下面的文字複製");
    };
    var ok=false;
    try{if(navigator.clipboard&&navigator.clipboard.writeText){
      navigator.clipboard.writeText(msg).then(done)["catch"](function(){
        var f=false;try{f=document.execCommand("copy")}catch(e){}
        f?done():fail();
      });ok=true}}catch(e){}
    if(!ok){var f=false;try{f=document.execCommand("copy")}catch(e){}f?done():fail()}
  };
  if(ADMIN)$("#selfTake").onclick=function(){receive(p);sel={};freeRows=[];mode="buy";render()};
  $("#backBtn").onclick=function(){sel={};freeRows=[];mode="order";render();window.scrollTo(0,0)};
}

/* ---------- 待採購 ---------- */
function receive(p){
  var ts=p.t||Date.now();
  (p.l||[]).forEach(function(a){var it=byId(a[0]);if(it)LIST.push({lid:uid("l"),iid:it.id,name:it.zh,urg:a[1]||0,done:false,ts:ts})});
  (p.f||[]).forEach(function(a){LIST.push({lid:uid("l"),iid:null,name:a[0],urg:a[1]||0,done:false,ts:ts})});
  saveList();
}
function viewInbox(){
  var p=inbox,rows=[];
  (p.l||[]).forEach(function(a){var it=byId(a[0]);if(it)rows.push([it.zh,a[1]])});
  (p.f||[]).forEach(function(a){rows.push([a[0],a[1]])});
  var h='<h2 class="cat">收到一張單 · '+fmt(p.t||Date.now())+'</h2><div class="card">';
  rows.forEach(function(r){
    h+='<div class="buyrow"><div class="body"><b>'+esc(r[0])+'</b>'
     +(r[1]?'<span class="tag">'+URG[r[1]].zh+'</span>':"")+'</div></div>'});
  return h+'<div class="field" style="margin-top:16px"><button class="btn cta" id="takeBtn">加入待採購</button>'
   +'<button class="btn ghost" id="dropBtn">先不要</button></div></div>';
}
function viewBuy(){
  if(!LIST.length)return '<div class="empty">目前沒有待採購的東西。<br>Ayu 送單過來的時候，你的 LINE 會收到。</div>'+footer();
  var open=LIST.filter(function(r){return !r.done}),done=LIST.filter(function(r){return r.done});
  var g={},order=[];
  open.forEach(function(r){
    var it=r.iid?byId(r.iid):null;
    var c=(it&&it.chan)?it.chan:"未分類";
    if(!g[c]){g[c]=[];order.push(c)}
    g[c].push(r);
  });
  order.sort(function(a,b){
    var ia=CHANS.indexOf(a),ib=CHANS.indexOf(b);
    if(ia<0)ia=99;if(ib<0)ib=99;return ia-ib});
  var h="";
  order.forEach(function(c){
    g[c].sort(function(a,b){return b.urg-a.urg});
    h+='<div class="chan"><h3>'+esc(c)+'<span class="n">'+g[c].length+'</span></h3><div class="card">';
    g[c].forEach(function(r){h+=buyRow(r)});
    h+='</div></div>';
  });
  if(done.length){
    h+='<h2 class="cat">已買 '+done.length+'</h2><div class="card">';
    done.forEach(function(r){h+=buyRow(r)});
    h+='</div><button class="btn ghost wide" id="clearDone" style="margin-top:12px">清掉已買的</button>';
  }
  return h+footer();
}
function buyRow(r){
  var it=r.iid?byId(r.iid):null,url=it&&it.url?it.url:"";
  return '<div class="buyrow'+(r.done?" done":"")+'">'
   +'<button class="tick" data-tick="'+r.lid+'" aria-pressed="'+r.done+'" aria-label="買好了">✓</button>'
   +'<div class="body"><b>'+esc(r.name)+'</b>'
   +(r.urg&&!r.done?'<span class="tag">'+URG[r.urg].zh+'</span>':"")
   +'<div class="meta mono">'+fmt(r.ts)+'</div></div>'
   +(url&&!r.done?'<a class="go" href="'+esc(url)+'" target="_blank" rel="noopener">去買</a>':(r.done?"":'<span class="nolink">無連結</span>'))
   +'</div>';
}

/* ---------- 品項管理 ---------- */
function viewManage(){
  var h='<p class="lead">品項、怎麼買、商品連結都在這裡改。改完按「儲存」只會存在這台手機；要讓 Ayu 也看到新版本，按「下載更新檔」再上傳到 GitHub。</p>'
   +'<div class="card"><div class="field"><input type="text" id="newZh" placeholder="新品項中文名"><button class="btn ghost" id="addItem">新增</button></div>'
   +'<div class="field"><input type="text" id="newChan" placeholder="新增購買管道，例：家樂福線上"><button class="btn ghost" id="addChan">加管道</button></div>'
   +'<p class="note">目前管道：'+CHANS.map(esc).join("、")+'</p></div>';
  CATS.forEach(function(c){
    var its=ITEMS.filter(function(i){return i.cat===c});
    if(!its.length)return;
    h+='<h2 class="cat">'+esc(c)+'</h2><div class="card">';
    its.forEach(function(i){
      h+='<div class="mrow"><div class="mhead"><span class="n">'+esc(i.zh)+'</span><button class="x" data-rm="'+i.id+'" aria-label="刪除">×</button></div><div class="mgrid">'
       +'<div><label class="lbl" for="zh_'+i.id+'">中文名</label><input type="text" id="zh_'+i.id+'" data-f="zh" data-id="'+i.id+'" value="'+esc(i.zh)+'"></div>'
       +'<div><label class="lbl" for="idn_'+i.id+'">印尼文</label><input type="text" id="idn_'+i.id+'" data-f="idn" data-id="'+i.id+'" value="'+esc(i.idn)+'"></div>'
       +'<div><label class="lbl" for="cat_'+i.id+'">分類</label><select id="cat_'+i.id+'" data-f="cat" data-id="'+i.id+'">'
       +CATS.map(function(c2){return '<option'+(c2===i.cat?" selected":"")+'>'+esc(c2)+'</option>'}).join("")+'</select></div>'
       +'<div><label class="lbl" for="chan_'+i.id+'">怎麼買</label><select id="chan_'+i.id+'" data-f="chan" data-id="'+i.id+'">'
       +'<option value=""'+(i.chan?"":" selected")+'>未分類</option>'
       +CHANS.map(function(p){return '<option'+(p===i.chan?" selected":"")+'>'+esc(p)+'</option>'}).join("")+'</select></div></div>'
       +'<div style="margin-top:10px"><label class="lbl" for="url_'+i.id+'">商品連結（沒有就空著）</label>'
       +'<input type="url" id="url_'+i.id+'" data-f="url" data-id="'+i.id+'" value="'+esc(i.url)+'" placeholder="貼上商品網址"></div></div>'});
    h+='</div>';
  });
  return h+footer();
}
function dockManage(){
  return '<div class="dock"><div class="in"><div class="count">品項 <b class="mono">'+ITEMS.length+'</b> 筆</div>'
   +'<button class="btn ghost" id="dlBtn">下載更新檔</button><button class="btn cta" id="saveBtn">儲存</button></div></div>';
}
function buildFile(){
  var css=document.getElementById("css").textContent;
  var app=document.getElementById("app").textContent;
  var json=JSON.stringify({v:1,cats:CATS,catsIdn:CATSIDN,chans:CHANS,items:ITEMS},null,1).replace(/</g,"\\u003c");
  var S1="<scr"+"ipt",E1="</scr"+"ipt>";
  return '<!doctype html>\n<html lang="zh-Hant">\n<head>\n<meta charset="utf-8">\n'
   +'<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">\n'
   +'<title>家務補給單</title>\n'
   +'<link rel="preconnect" href="https://fonts.googleapis.com">\n'
   +'<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>\n'
   +'<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=JetBrains+Mono:wght@400;500&family=Noto+Sans+TC:wght@400;500&display=swap">\n'
   +'<style id="css">'+css+'</style>\n</head>\n<body>\n\n'
   +S1+' id="data" type="application/json">\n'+json+'\n'+E1+'\n\n'
   +'<div id="root"></div>\n<div id="dock"></div>\n\n'
   +S1+' id="app">'+app+E1+'\n</body>\n</html>\n';
}

/* ---------- 繪製 ---------- */
function render(){
  var body = mode==="order"?viewOrder() : mode==="buy"?((inbox?viewInbox():"")+viewBuy()) : viewManage();
  $("#root").innerHTML='<div class="wrap">'+header()+body+'</div>';
  $("#dock").innerHTML = mode==="order"?dockOrder() : mode==="manage"?dockManage() : "";
  wire();
}
function wireCommon(){
  document.querySelectorAll("[data-tab]").forEach(function(b){
    b.onclick=function(){mode=b.dataset.tab;render();window.scrollTo(0,0)}});
  var ea=$("#enterAdmin");
  if(ea)ea.onclick=function(){ADMIN=true;LS.set("admin",true);mode="buy";render();window.scrollTo(0,0)};
  var xa=$("#exitAdmin");
  if(xa)xa.onclick=function(){ADMIN=false;LS.set("admin",false);mode="order";render();window.scrollTo(0,0)};
}
function refOf(k,kind){return kind==="free"?freeRows[+k.slice(1)]:sel[k]}
function wire(){
  wireCommon();
  if(mode==="order"){
    document.querySelectorAll("[data-pick]").forEach(function(b){
      b.onclick=function(){var id=b.dataset.pick;if(sel[id])delete sel[id];else sel[id]={urg:0};render()}});
    document.querySelectorAll(".urg [data-u]").forEach(function(b){
      b.onclick=function(){var r=refOf(b.dataset.k,b.dataset.kind);if(!r)return;r.urg=+b.dataset.u;render()}});
    document.querySelectorAll("[data-del]").forEach(function(b){
      b.onclick=function(){
        if(b.dataset.kind==="free")freeRows.splice(+b.dataset.del.slice(1),1);else delete sel[b.dataset.del];
        render()}});
    var fi=$("#freeIn"),fa=$("#freeAdd");
    if(fa)fa.onclick=function(){var v=(fi.value||"").trim();if(!v)return;freeRows.push({name:v,urg:0});render();var n=$("#freeIn");if(n)n.focus()};
    if(fi)fi.onkeydown=function(e){if(e.key==="Enter"){e.preventDefault();fa.click()}};
    var mk=$("#mk");if(mk)mk.onclick=showSent;
  }
  if(mode==="buy"){
    var tb=$("#takeBtn");
    if(tb){
      tb.onclick=function(){receive(inbox);inbox=null;history.replaceState(null,"",location.pathname+location.search);render()};
      $("#dropBtn").onclick=function(){inbox=null;history.replaceState(null,"",location.pathname+location.search);render()};
    }
    document.querySelectorAll("[data-tick]").forEach(function(b){
      b.onclick=function(){
        var r=LIST.filter(function(x){return x.lid===b.dataset.tick})[0];
        if(!r)return;r.done=!r.done;saveList();render()}});
    var cd=$("#clearDone");
    if(cd)cd.onclick=function(){LIST=LIST.filter(function(r){return !r.done});saveList();render()};
  }
  if(mode==="manage"){
    document.querySelectorAll("[data-f]").forEach(function(el){
      el.onchange=function(){var it=byId(el.dataset.id);if(it)it[el.dataset.f]=el.value}});
    document.querySelectorAll("[data-rm]").forEach(function(b){
      b.onclick=function(){ITEMS=ITEMS.filter(function(i){return i.id!==b.dataset.rm});render()}});
    $("#addItem").onclick=function(){
      var v=($("#newZh").value||"").trim();if(!v)return;
      ITEMS.push({id:uid("i"),zh:v,idn:"",cat:CATS[0],chan:"",url:""});render()};
    $("#addChan").onclick=function(){
      var v=($("#newChan").value||"").trim();if(!v)return;
      if(CHANS.indexOf(v)<0)CHANS.push(v);render()};
    $("#saveBtn").onclick=function(){saveAll();toast("已存在這台手機")};
    $("#dlBtn").onclick=function(){
      saveAll();
      var blob=new Blob([buildFile()],{type:"text/html;charset=utf-8"});
      var a=document.createElement("a");
      a.href=URL.createObjectURL(blob);a.download="index.html";
      document.body.appendChild(a);a.click();
      setTimeout(function(){URL.revokeObjectURL(a.href);a.remove()},1500);
      toast("下載好了，上傳到 GitHub 覆蓋舊檔");
    };
  }
}

/* ---------- 啟動 ---------- */
(function(){
  var m=/[#&]o=([^&]+)/.exec(location.hash);
  if(m){try{inbox=JSON.parse(b64d(m[1]))}catch(e){inbox=null}}
  if(inbox){ADMIN=true;LS.set("admin",true);mode="buy"}
  else if(/#admin/.test(location.hash)){ADMIN=true;LS.set("admin",true);mode="manage"}
  else if(/#buy/.test(location.hash)&&ADMIN){mode="buy"}
})();
render();
})();
</script>
</body>
</html>
